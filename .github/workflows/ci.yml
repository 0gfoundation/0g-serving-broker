name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: api/go.sum

    - name: Build
      working-directory: api
      run: go build ./...

    - name: Test
      working-directory: api
      run: go test -cover ./...

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: api/go.sum

    - name: Integration tests
      working-directory: api
      run: go test -tags integration ./inference/... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic -timeout 600s

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-coverage
        path: api/coverage.out
