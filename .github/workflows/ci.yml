name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Restrict default permissions to read-only
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.24'
        cache-dependency-path: api/go.sum

    - name: Build
      working-directory: api
      run: go build ./...

    - name: Test
      working-directory: api
      run: go test -cover ./...

  gate-script-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    # Unit tests for the LLM benchmark gate (.github/scripts/aiperf_gate.py).
    # Pure stdlib — the runner's system python3 is sufficient.
    - name: Gate script tests
      run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.24'
        cache-dependency-path: api/go.sum

    - name: Integration tests
      working-directory: api
      run: go test -tags integration ./inference/... ./fine-tuning/... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic -timeout 900s

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: integration-coverage
        path: api/coverage.out
