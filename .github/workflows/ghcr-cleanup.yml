name: Prune Untagged GHCR Versions

on:
  schedule:
    # Sundays 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    # Not actions/delete-package-versions: GHCR has no Referrers API, so
    # attest-build-provenance stores a release's SLSA bundle as an untagged
    # child of a `sha256-<digest>` index. That action sees the child as a
    # plain untagged version and would delete released images' provenance.
    # This one drops referrer and cosign children from the working set before
    # applying any retention rule.
    - name: Prune untagged container versions
      uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
      with:
        owner: ${{ github.repository_owner }}
        package: 0g-serving-broker
        # Buffer for anyone running a digest pulled just before its tag moved.
        keep-n-untagged: 10
        # Sweep signatures and attestations whose subject image is already gone.
        delete-orphaned-images: true
