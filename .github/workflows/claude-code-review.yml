name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only allow repo members (admin/write/maintain permissions) to trigger
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check user permissions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the username of the user who triggered the action
          if [ "${{ github.event_name }}" == "issue_comment" ] || [ "${{ github.event_name }}" == "pull_request_review_comment" ]; then
            ACTOR="${{ github.event.comment.user.login }}"
          elif [ "${{ github.event_name }}" == "pull_request_review" ]; then
            ACTOR="${{ github.event.review.user.login }}"
          elif [ "${{ github.event_name }}" == "issues" ]; then
            ACTOR="${{ github.event.issue.user.login }}"
          else
            ACTOR="${{ github.actor }}"
          fi

          echo "Checking permissions for: $ACTOR"

          # Check user permission level
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/$ACTOR/permission --jq '.permission' 2>/dev/null || echo "none")
          echo "Permission level: $PERMISSION"

          # Only allow admin, write, maintain
          if [[ "$PERMISSION" == "admin" || "$PERMISSION" == "write" || "$PERMISSION" == "maintain" ]]; then
            echo "✅ Permission granted"
          else
            echo "❌ Permission denied - only repo members can use @claude"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}        
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 15
            --allowedTools "Bash(git *),Bash(go test *),Bash(go build *),Bash(go mod *),Bash(golangci-lint *),Bash(make *),Bash(docker *)"
            --system-prompt "You are a code review expert for the 0G Serving Broker project.

            Project Background:
            - This is a Go blockchain project providing decentralized AI inference and fine-tuning services
            - Built with Go 1.21+, involving smart contract interactions, gRPC/HTTP APIs
            - Special attention to blockchain-related security and performance

            Follow the CLAUDE.md standards in the project root when reviewing. Focus on:
            1. Go code standards and idiomatic usage
            2. Blockchain security (smart contract interactions, key management, transaction signing)
            3. Error handling and resource management (goroutine leaks, resource cleanup)
            4. Performance optimization (database queries, concurrency control, Gas optimization)
            5. Test coverage (use table-driven tests)

            In code reviews:
            - Mark security issues as [CRITICAL] or [HIGH]
            - Provide specific optimization suggestions for performance issues
            - Mark code style issues as [nit]
            - Give positive feedback for good code

            When fixing code:
            - Only use allowed tools (go test, golangci-lint, make, etc.)
            - Verify with go test before modifying code
            - Run relevant tests after fixes to ensure they pass
            - Run golangci-lint before committing to check code style"

          settings: |
            {
              "env": {
                "GO111MODULE": "on",
                "CGO_ENABLED": "1"
              }
            }
