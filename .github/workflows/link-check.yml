name: Link Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.go'
  schedule:
    - cron: '0 9 * * 1'

jobs:
  check-links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs.0g.ai links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --include 'https://docs\.0g\.ai'
            --include-fragments
            --max-retries 3
            --retry-wait-time 10
            '**/*.md'
            '**/*.go'
          fail: true

  scheduled-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs.0g.ai links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --include 'https://docs\.0g\.ai'
            --include-fragments
            --max-retries 3
            --retry-wait-time 10
            '**/*.md'
            '**/*.go'
          format: markdown
          output: lychee-results.md
          fail: false

      - name: Create issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        run: |
          gh issue create \
            --title "Broken docs.0g.ai links detected ($(date +%Y-%m-%d))" \
            --body-file lychee-results.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
