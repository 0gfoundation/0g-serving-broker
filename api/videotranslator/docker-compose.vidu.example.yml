# Example deployment for the Vidu (start/end-frame-to-video) video translator.
#
# Same standalone-snippet caveat as docker-compose.example.yml (the DashScope
# variant): merge this service into your own provider compose only when serving
# a Vidu video model. It is a stateless protocol shim — it maps the OpenAI
# Video API shape the broker speaks onto Vidu's native async job API
# (POST .../aigc/video-generation/video-synthesis, GET .../tasks/{task_id}).
# The broker owns polling-to-completion and billing; this container never does.
#
# Region restriction: Vidu is documented ONLY for the China North 2 (Beijing)
# region — the model, endpoint hostname, and API key must all belong to that
# same region. There is no other region/endpoint variant.
#
# Broker-side wiring (three things):
#   1. Register the provider's on-chain Service.Url as this container's address
#      (e.g. http://0g-vidu-video-translator:8090) instead of the vendor's real
#      workspace endpoint.
#   2. Set additionalSecret in the broker's config.yaml so it injects the Vidu
#      key on every outbound call:
#        additionalSecret:
#          Authorization: "Bearer <your-dashscope-api-key>"
#      The translator never stores or reads the key itself — it only forwards
#      whatever Authorization header the broker sends (see internal/vidu/client.go).
#   3. Configure per-second, resolution-tiered billing for the model (Vidu
#      bills by both duration and resolution — see the model pricing
#      variants[] schema, api/inference/config/model_pricing.go). The
#      translator maps Vidu's usage.duration (the vendor's actually-BILLED
#      duration, not usage.output_video_duration, which is the output clip
#      length and can diverge) onto the broker's usage.output_video_duration
#      field, which resolveVideoBilling meters; resolution is derived from
#      the vendor's own usage.SR field at poll time.
#
# VIDU_BASE_URL is REQUIRED — there is no working default the way MiniMax's
# api.minimax.io is one. The hostname itself embeds your workspace ID
# ({WorkspaceId}.cn-beijing.maas.aliyuncs.com); replace the placeholder below
# with your real workspace-specific endpoint before deploying.
services:
  0g-vidu-video-translator:
    image: ghcr.io/0gfoundation/0g-serving-broker:latest
    container_name: 0g-vidu-video-translator
    command: 0g-vidu-video-translator
    environment:
      - PORT=8090
      - LOG_LEVEL=info
      - VIDU_BASE_URL=https://your-workspace-id.cn-beijing.maas.aliyuncs.com # REQUIRED, no default — replace with your real workspace endpoint
      # - VIDU_REQUEST_TIMEOUT_SECONDS=30
    networks:
      - localhost

networks:
  localhost:
    name: localhost
    external: true
