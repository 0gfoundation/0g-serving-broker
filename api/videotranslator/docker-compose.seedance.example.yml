# Example deployment for the ByteDance Seedance 2.5 video translator.
#
# Same standalone-snippet caveat as docker-compose.example.yml (the DashScope
# variant): merge this service into your own provider compose only when
# serving a Seedance video model. It is a stateless protocol shim — it maps
# the OpenAI Video API shape the broker speaks onto Seedance's native async
# job API (POST /api/v3/contents/generations/tasks, GET
# /api/v3/contents/generations/tasks/{id}) on BytePlus Ark
# (ark.ap-southeast.bytepluses.com, region ap-southeast-1). The broker owns
# polling-to-completion and billing; this container never does.
#
# Broker-side wiring (four things):
#   1. Register the provider's on-chain Service.Url as this container's
#      address (e.g. http://0g-seedance-video-translator:8090) instead of
#      ark.ap-southeast.bytepluses.com. ALSO: the on-chain Service's MODEL
#      NAME must be ByteDance's exact wire id, "dreamina-seedance-2-5-260628"
#      — NOT the router catalog's canonical "bytedance/seedance-2.5". The
#      router rewrites the outbound "model" field to whatever the provider
#      registered, and Seedance's strict validation 400s on anything else.
#   2. Set additionalSecret in the broker's config.yaml so it injects the
#      ARK_API_KEY on every outbound call:
#        additionalSecret:
#          Authorization: "Bearer <your-ark-api-key>"
#      The translator never stores or reads the key itself — it only forwards
#      whatever Authorization header the broker sends (see
#      internal/seedance/client.go). No AK/SK signing, just a Bearer token.
#   3. Billing: Seedance bills on a vendor-reported TOKEN count
#      (usage.completion_tokens), not a flat per-second rate — set the
#      model's billing mode to per_video_token in the broker's model pricing
#      (see api/inference/config/model_pricing.go's BillingModePerVideoToken).
#      The translator forwards usage.completion_tokens as-is onto the
#      broker's usage.completion_tokens field. (A legacy per_video_second/
#      per_unit_table config still receives a best-effort actual-seconds
#      echo as a fallback signal, but per_video_token is the accurate mode
#      for this vendor.)
#   4. Keep TEE verification: this sidecar reports the vendor's TLS
#      certificate back to the broker (Zg-Upstream-Cert-Fingerprint), so the
#      provider can stay providerType: centralized instead of falling back to
#      the non-verifiable "standard" type. Set all four, and run this
#      container in the SAME CVM as the broker — that co-location is what
#      makes the report trustworthy:
#        service:
#          providerType: centralized
#          providerIdentity: seedance
#          targetTLSProxy: true
#          upstreamDomain: ark.ap-southeast.bytepluses.com
#      See docs/design/sidecar-routing-proof.md.
#
# Input modes this translator supports, all through the SAME /videos
# request shape:
#   - text-to-video: prompt only.
#   - image-to-video (single first frame): input_reference.image_url only.
#     input_reference.file_id is a real OpenAI Video API field too, but gets
#     a hard 400 here instead: Seedance has no client-usable file-handle
#     namespace this integration can resolve a file_id against (unlike
#     MiniMax, which maps one onto its own vendor handle), so silently
#     falling back to text-to-video would bill a client for a different
#     video than they asked for — this is a reject, not a silent drop.
# These are the only two Seedance capabilities that map onto a real OpenAI
# Video API field (prompt, input_reference). Seedance ALSO supports
# first+last-frame control (input_reference + last_frame_reference) and
# multimodal reference-based generation (reference_images ≤30, reference_videos
# ≤10, reference_audio ≤10, including audio-only input), but OpenAI's Video API
# has no field to express either one — per this integration's compatibility
# principle (the client may only use fields that already exist in the OpenAI
# Video API, translated 1:1 into each vendor's native shape), this integration
# deliberately does not add a client-facing input for them. A request naming
# last_frame_reference or any reference_images/videos/audio key has those keys
# silently ignored (not a 400) and proceeds on whatever OpenAI-real fields were
# also present — unlike file_id above, these have no real vendor mapping to
# reject a client into using instead, so silent-ignore (not 400) is the right
# call for them specifically.
#   - video editing / video extension are explicitly OUT OF SCOPE for this
#     integration and are not implemented as a distinct feature or endpoint
#     here.
#
# SEEDANCE_BASE_URL, if set, MUST be scheme+host only (e.g.
# https://ark.ap-southeast.bytepluses.com) — NOT
# https://ark.ap-southeast.bytepluses.com/api/v3. The /api/v3 version lives
# in the client's path constants; a path suffix here would double the prefix
# on every call. Its host must equal service.upstreamDomain above, or the
# broker refuses to sign the routing proof (reason: domain_mismatch).
#
# Duration: Seedance 2.5 accepts any integer in [4,30] seconds (raised from
# 2.0's [4,15], live-confirmed: 31 rejected, 30 accepted) and the translator
# clamps a client's "seconds" into that range (never rejects) — billing is
# always on the vendor's echoed actuals, never the request, so clamping
# cannot mis-bill, only affect what gets generated.
#
# Resolution: 480p/720p ONLY (narrower than 2.0's 480p/720p/1080p/4k —
# live-confirmed: 1080p/4k are rejected outright for "dreamina-
# seedance-2-5-260628" with InvalidParameter). A client requesting a
# 1080p/4K-equivalent size silently gets a 720p video instead of a 400 (the
# translator's existing snap-not-reject resolution handling). There is no
# 4K tier for this model at all, so 2.0's 4K-specific vendor rate limit
# (15 RPM / 1 concurrent) does not apply here.
services:
  0g-seedance-video-translator:
    image: ghcr.io/0gfoundation/0g-serving-broker:latest
    container_name: 0g-seedance-video-translator
    command: 0g-seedance-video-translator
    environment:
      - PORT=8090
      - LOG_LEVEL=info
      # MUST agree with the broker's service.upstreamDomain — that is the host
      # the broker tells verifiers to fetch a certificate from, and this is
      # the host actually dialed. The broker compares the two on every
      # response and refuses to sign a routing proof when they differ
      # (reason: domain_mismatch).
      # - SEEDANCE_BASE_URL=https://ark.ap-southeast.bytepluses.com
      # - SEEDANCE_REQUEST_TIMEOUT_SECONDS=30
    networks:
      - localhost

networks:
  localhost:
    name: localhost
    external: true
