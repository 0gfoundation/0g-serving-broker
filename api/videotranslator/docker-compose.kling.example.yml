# Example deployment for the Kling video translator.
#
# Same standalone-snippet caveat as docker-compose.example.yml (the DashScope
# variant): merge this service into your own provider compose only when
# serving Kling's video-generation model. It is a stateless protocol shim —
# it maps the OpenAI Video API shape the broker speaks onto Kling's native
# async job API (POST
# /api/v1/services/aigc/video-generation/video-synthesis, GET
# /api/v1/tasks/{task_id}) on Aliyun Bailian / model-studio (China North 2 /
# Beijing only). The broker owns polling-to-completion and billing; this
# container never does.
#
# Broker-side wiring (four things):
#   1. Register the provider's on-chain Service.Url as this container's
#      address (e.g. http://0g-kling-video-translator:8090) instead of the
#      Kling API host directly. ALSO: the on-chain Service's MODEL NAME must
#      be exactly "kling/kling-v3-video-generation" — this integration only
#      registers/supports the BASE model, never the omni variant
#      ("kling/kling-v3-omni-video-generation"): everything omni adds beyond
#      base (reference-video generation, video editing, its refer/base/
#      feature media types, element_list) has no real OpenAI Video API field
#      to express, and everything omni also does that base does too
#      (first-frame i2v) is already covered by the base model.
#   2. Set additionalSecret in the broker's config.yaml so it injects the
#      DASHSCOPE_API_KEY on every outbound call:
#        additionalSecret:
#          Authorization: "Bearer <your-dashscope-api-key>"
#      The translator never stores or reads the key itself — it only forwards
#      whatever Authorization header the broker sends (see
#      internal/kling/client.go).
#   3. Billing: Kling bills PER SECOND (usage.duration, the vendor's own
#      billed-seconds field) — NOT per token like Seedance — with price
#      varying by resolution tier (std=720p / pro=1080p) AND by whether audio
#      was generated. The operator's real price list is two-dimensional, IN
#      RMB/CNY (人民币元 — this is what Aliyun bills the OPERATOR, not what
#      0G bills the end user; see the paragraph below):
#
#        720P            0.9 元(人民币/RMB/CNY)/秒
#        1080P           1.2 元(人民币/RMB/CNY)/秒
#        720P 无声 (silent)   0.6 元(人民币/RMB/CNY)/秒
#        1080P 无声 (silent)  0.8 元(人民币/RMB/CNY)/秒
#
#      This repo has NO currency-conversion code anywhere — these RMB figures
#      never appear as a code literal, only in this comment, precisely so
#      nothing here could silently misinterpret them. The operator must
#      manually convert this RMB cost (plus their own margin) into whatever
#      unit their OWN billing.resolutionMultipliers (native, in 0G-token wei)
#      or pricing_usd (USD decimal string) actually uses — there is no
#      automatic RMB→wei or RMB→USD conversion anywhere in this repo. Typing
#      "0.6"/"0.8" verbatim into either of those fields, unconverted, would
#      misprice every request (e.g. treating 0.6 RMB as if it were 0.6 USD
#      overcharges end users by ~7x; treating it as 0.6 wei of 0G's own
#      token undercharges by many orders of magnitude).
#
#      This integration hardcodes audio:false on every create (no OpenAI
#      Video API field exposes it — see translate/kling.go), so only the two
#      "无声"/silent rows (std=0.6, pro=0.8) are EVER reachable from this
#      translator; the with-audio rows exist in a complete price table only
#      for parity with the vendor's real price list and for forward-readiness
#      if a future change ever exposes audio as a client-facing option — an
#      unreachable-today, published-for-completeness row, the same shape a
#      hypothetical Seedance has_video_input=true row would be IF that
#      dimension were wired into the router's matching allowlist, which it is
#      not today (0g-router's videoDimensionKeys recognizes only `resolution`,
#      `duration_seconds`, and, as of this change, `has_audio` — no
#      `has_video_input` entry exists on main). Configure this model's
#      billing mode as per_video_second in the
#      broker's model pricing (see api/inference/config/model_pricing.go's
#      BillingModePerVideoSecond) with a resolutionMultiplier keyed on "std"
#      and "pro" (Kling's own wire tier tokens — see common/videospec/
#      kling.go's Tier). Also set `vendor: kling` on that model's billing
#      config so common/videospec resolves the same (duration, tier) the
#      translator itself resolves — see that package's doc for why the two
#      must never independently derive an answer.
#
#      The four-row {resolution, has_audio}-dimensioned price table above is
#      published on the 0G ROUTER side (its own on-chain provider price
#      data). Two-dimensional variant rows are not new there — the bucketed
#      per_unit_table shape already matches on {resolution, duration_seconds}
#      together — but `has_audio` itself is a new dimension key, and this is
#      the first `video_second`-unit table dimensioned on two keys at once
#      rather than one; a {resolution, has_video_input} table for Seedance
#      has been proposed in design notes but is NOT wired into 0g-router's
#      videoDimensionKeys allowlist today, so there is no existing precedent
#      for THAT specific dimension this reuses — see 0g-router's
#      pkg/modelregistry/models.yaml PRICING NOTE on
#      kling/kling-v3-video-generation for the full reasoning and the exact
#      wire dimension name.
#   4. Keep TEE verification: this sidecar reports the vendor's TLS
#      certificate back to the broker (Zg-Upstream-Cert-Fingerprint), so the
#      provider can stay providerType: centralized instead of falling back to
#      the non-verifiable "standard" type. Set all four, and run this
#      container in the SAME CVM as the broker — that co-location is what
#      makes the report trustworthy:
#        service:
#          providerType: centralized
#          providerIdentity: kling
#          targetTLSProxy: true
#          upstreamDomain: <your-workspace-id>.cn-beijing.maas.aliyuncs.com
#      See docs/design/sidecar-routing-proof.md.
#
# Input modes this translator supports, all through the SAME /videos request
# shape:
#   - text-to-video: prompt only.
#   - image-to-video (single first frame): input_reference.image_url only.
#     input_reference.file_id is a real OpenAI Video API field too, but gets
#     a hard 400 here instead: Kling has no client-usable file-handle
#     namespace this integration can resolve a file_id against (unlike
#     MiniMax, which maps one onto its own vendor handle), so silently
#     falling back to text-to-video would bill a client for a different video
#     than they asked for — this is a reject, not a silent drop.
# These are the only two Kling capabilities that map onto a real OpenAI Video
# API field (prompt, input_reference). Kling ALSO supports first+last-frame
# control (media[].type="last_frame"), storyboard/multi-shot generation
# (multi_shot/shot_type/multi_prompt), and subject references (element_list),
# and its omni model additionally supports reference-video generation, video
# editing, and a wider media[].type set (refer/base/feature) — but OpenAI's
# Video API has no field to express any of them, so per this integration's
# compatibility principle this integration deliberately does not add a
# client-facing input for any of it, and does not register the omni model at
# all.
#
# audio and watermark are ALWAYS sent explicitly as false on every create —
# never client-configurable, never left to the vendor's own default: no
# paying customer wants Kling's watermark, and audio generation bills extra
# with no OpenAI Video API field to request it either.
#
# KLING_BASE_URL is REQUIRED — unlike every other vendor this translator
# supports, Kling has NO public/universal endpoint: every Aliyun workspace is
# served from its own https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
# subdomain. KlingMain fails fast at startup if this is unset, rather than
# silently constructing requests against no host at all. Its host must equal
# service.upstreamDomain above, or the broker refuses to sign the routing
# proof (reason: domain_mismatch).
#
# Duration: Kling accepts an integer in [3,15] seconds, default 5 when
# omitted. The translator clamps a client's "seconds" into that range —
# billing is always on the vendor's echoed usage.duration, never the
# request, so clamping cannot mis-bill, only affect what gets generated. The
# one exception is a magnitude no duration can be resolved from at all (e.g.
# 1e30), which is refused with a 400 rather than clamped. The rules are
# recorded once, in common/videospec, and both the broker's balance gate and
# this translator read them — see that package's doc.
#
# Resolution: std (720p) / pro (1080p, the vendor's own default when the
# field is omitted) — derived from the client's "size" pixel dimensions by a
# fixed 1280px longer-side threshold (mirrors DashScope's own two-tier
# threshold). An unparsable/empty size OMITS parameters.mode entirely,
# letting the vendor apply its documented "pro" default, rather than
# guessing.
services:
  0g-kling-video-translator:
    image: ghcr.io/0gfoundation/0g-serving-broker:latest
    container_name: 0g-kling-video-translator
    command: 0g-kling-video-translator
    environment:
      - PORT=8090
      - LOG_LEVEL=info
      # REQUIRED. MUST agree with the broker's service.upstreamDomain — that
      # is the host the broker tells verifiers to fetch a certificate from,
      # and this is the host actually dialed. The broker compares the two on
      # every response and refuses to sign a routing proof when they differ
      # (reason: domain_mismatch).
      - KLING_BASE_URL=https://<your-workspace-id>.cn-beijing.maas.aliyuncs.com
      # - KLING_REQUEST_TIMEOUT_SECONDS=30
    networks:
      - localhost

networks:
  localhost:
    name: localhost
    external: true
