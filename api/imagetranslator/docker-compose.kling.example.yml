# Example deployment for the Kling image translator.
#
# Standalone snippet — merge this service into your own provider compose only
# when serving a Kling image model. It is a poll-loop-then-respond protocol
# shim: it maps the broker's existing OpenAI-shaped image-generation contract
# (POST /v1/async/images/generations, wait=true, {data:[{b64_json}]}) onto
# Kling's native async job API (POST .../aigc/image-generation/generation,
# GET .../tasks/{task_id}) — internally polling Kling to a terminal state
# before ever responding to the broker, since the broker itself has no
# deferred-poll billing scheduler for images to lean on (unlike video).
#
# Region restriction: Kling is documented ONLY for the China North 2 (Beijing)
# region — the model, endpoint hostname, and API key must all belong to that
# same region. There is no other region/endpoint variant.
#
# Broker-side wiring (four things):
#   1. Register the provider's on-chain endpoint as this container's address
#      (e.g. http://0g-kling-image-translator:8091) instead of the vendor's
#      real workspace endpoint.
#   2. Set additionalSecret in the broker's config.yaml so it injects the
#      Kling key on every outbound call:
#        additionalSecret:
#          Authorization: "Bearer <your-dashscope-api-key>"
#      The translator never stores or reads the key itself — it only forwards
#      whatever Authorization header the broker sends (see internal/kling/client.go).
#   3. Configure per-image-count billing for the model (Kling bills on image
#      count via the broker's existing OutputCount mechanism — no new
#      per_video_second/per_unit_table pricing needed, unlike video).
#   4. Keep TEE verification: this sidecar reports the vendor's TLS certificate
#      back to the broker (Zg-Upstream-Cert-Fingerprint), so the provider can stay
#      providerType: centralized instead of falling back to the non-verifiable
#      "standard" type. Set all four, and run this container in the SAME CVM as the
#      broker — that co-location is what makes the report trustworthy:
#        service:
#          providerType: centralized
#          providerIdentity: kling
#          targetTLSProxy: true
#          upstreamDomain: your-workspace-id.cn-beijing.maas.aliyuncs.com
#      See docs/design/sidecar-routing-proof.md.
#
# KLING_BASE_URL is REQUIRED — there is no working default. The hostname
# itself embeds your workspace ID ({WorkspaceId}.cn-beijing.maas.aliyuncs.com);
# replace the placeholder below with your real workspace-specific endpoint
# before deploying.
#
# v1 scope: only kling/kling-v3-image-generation is supported (n 1-9,
# aspect_ratio, resolution 1k/2k, a single optional reference image,
# watermark). kling/kling-v3-omni-image-generation (result_type/
# series_amount/4k/multi-image input) is a tracked v2 item.
services:
  0g-kling-image-translator:
    image: ghcr.io/0gfoundation/0g-serving-broker:latest
    container_name: 0g-kling-image-translator
    command: 0g-kling-image-translator
    environment:
      - PORT=8091
      - LOG_LEVEL=info
      - KLING_BASE_URL=https://your-workspace-id.cn-beijing.maas.aliyuncs.com # REQUIRED, no default — replace with your real workspace endpoint
      # - KLING_REQUEST_TIMEOUT_SECONDS=30
    networks:
      - localhost

networks:
  localhost:
    name: localhost
    external: true
