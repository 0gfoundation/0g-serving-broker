services:
  config-init:
    image: alpine:latest
    volumes:
      - config-vol:/config
    command: sh -c 'echo "" | base64 -d > /config/config.yaml'

  mysql:
    image: mysql:8.0
    container_name: 0g-fine-tune-broker-db
    ports:
      - "33060:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=fineTune
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      retries: 5
    networks:
      - localhost
    depends_on:
      config-init:
        condition: service_completed_successfully

  0g-fine-tune-broker:
    image: ghcr.io/0gfoundation/0g-serving-broker:2d03306-fix-amd64
    privileged: true
    restart: always
    container_name: 0g-fine-tune-broker
    environment:
      - PORT=3080
      - CONFIG_FILE=/etc/config/config.yaml
      - NVIDIA_VISIBLE_DEVICES=all
      - TOKEN=PHALA@2025
    ports:
      - "80:3080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - config-vol:/etc/config:ro
      - /tmp:/tmp
      - /tmp/0g-transformer-bridge:/opt/transformer-bridge
      - ./models:/fine-tuning/execution/models
      - /dstack/persistent:/dstack/persistent
    command: ["0g-fine-tuning-server", "--config", "/etc/config/config.yaml"]
    networks:
      - localhost
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  config-vol:

networks:
  localhost:
    name: localhost
    external: false
