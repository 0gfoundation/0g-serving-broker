# Example: multi-model video-generation service running in `standard`
# provider mode, forwarding to Alibaba DashScope's HappyHorse video-generation
# API, with two model versions (1.1 / 1.0) and resolution-tiered (720p vs
# 1080p) pricing per model via the per_video_second billing mode.
#
# `standard` (constant.ProviderTypeStandard): no TEE verification, the broker
# is a pure forwarder to targetUrl, and it never advertises WHO it forwards to
# (service.providerIdentity must be left unset — config validation rejects it
# otherwise). See config.go's providerType=='standard' validation block for
# the exact constraints this file satisfies.
#
# CAUTION (standard + video-generation): the broker only fully hides the
# upstream when the response returns the finished asset via the OpenAI-style
# GET /videos/{id}/content pattern (broker-proxied). If DashScope's response
# instead embeds a direct asset URL (e.g. {"output":{"video_url":"https://
# dashscope-upstream-host/..."}}), that host is visible to the client — the
# broker does not rewrite URL values inside the response body. Confirm which
# shape your upstream actually returns before relying on `standard` to fully
# hide it (see docs/design/video-generation-async-billing.md).

interval:
  autoSettleBufferTime: "60s"
  forceSettlementProcessor: "10m"
  settlementProcessor: "5m"

network:
  url: "https://evmrpc-testnet.0g.ai"
  chainID: 16602
  privateKeys:
    - <Private_Key>
  transactionLimit: 5000000
  gasEstimationBuffer: 100000

# Required because service.priceDenomination is "USD" below: at least one
# rate source, so the live 0G/USD rate can be computed and cached.
priceFeed:
  sources:
    - "coingecko"
    - "binance"
  updateInterval: "5m"
  # coinGeckoApiKey: <CoinGecko API Key>  # strongly recommended in production — the anonymous tier rate-limits hard
  # coinGeckoKeyType: "demo"

service:
  type: "video-generation"
  providerType: "standard"
  # Required even in multi-model mode: the on-chain-advertised default model.
  # Must match one of the modelPricing[].model entries below.
  model: "happyhorse-1.1"
  # Required for `standard`: the upstream this broker forwards to. No
  # providerIdentity is set here — a standard provider never advertises which
  # upstream it hides behind.
  targetUrl: "https://dashscope.aliyuncs.com"
  servingUrl: <Serving URL>

  # USD-denominated: modelPricing[].outputPriceUSDPerSecond below is USD per
  # EFFECTIVE output second (i.e. already resolution-scaled — see billing
  # below), normalized against the live 0G/USD rate from priceFeed above at
  # billing/display time. To use NATIVE (neuron) pricing instead, drop
  # priceDenomination and set modelPricing[].outputPrice (integer wei string)
  # in place of outputPriceUSDPerSecond.
  priceDenomination: "USD"

  modelPricing:
    - model: "happyhorse-1.1"
      # TODO: replace with the EXACT model identifier DashScope's video API
      # expects. video-generation has no upstreamModel rewrite (that's
      # chatbot-only — see ModelPricingEntry.UpstreamModel), so whatever
      # string is set here is forwarded to targetUrl byte-for-byte in the
      # outgoing request body.
      canonicalId: "happyhorse-1.1"
      # Baseline price (multiplier 1.0) — this example treats 720p as the
      # baseline and 1080p as a 1.5x premium; adjust to match DashScope's
      # actual published rate card for this model.
      outputPriceUSDPerSecond: "0.35"
      billing:
        mode: per_video_second
        resolutionMultipliers:
          "720p": 1.0
          "1080p": 1.5
      modelInfo:
        name: "HappyHorse 1.1"
        description: "Alibaba DashScope HappyHorse video-generation model, v1.1"
        architecture:
          modality: "text->video"
          inputModalities: ["text"]
          outputModalities: ["video"]
        supportedParameters:
          - prompt
          - size
          - seconds
        # REQUIRED for video-generation, and billing-relevant rather than merely
        # documentation: the pre-flight balance reserve prices a create that OMITS
        # `seconds` / `size` at these values, because the upstream applies its own
        # defaults and bills them. Publish what the upstream actually applies —
        # Omitting `seconds` is WARNED about at boot and then refused at request
        # time (a broker-attributed 503), because refusing every conforming create
        # that omits the field is the alternative — so publish it. A PRESENT-but-
        # unusable value for either field fails the boot instead: that one is a typo
        # the operator cannot otherwise see (a wrong `size` silently moves the
        # reserve away from the bill, with no error, log or metric).
        defaultParameters:
          # 1080p, NOT the cheaper 720p row: with no resolution in the request DashScope applies
          # its OWN default of 1080P (see videotranslator sizeToDashScopeParams), so 1080p is the
          # tier the RESERVE must cover. This is a reserve statement only — an earlier version of
          # this comment claimed it also fixed the provider under-billing itself, and that is wrong:
          # settlement's published-size substitution is per_unit_table only, and this block is
          # per_video_second, so a size-less create still BILLS the 1.0 baseline whatever is
          # published here. Measured: reserve 8, bill 5. The under-billing is a separate gap; what
          # this value buys is that a settlement which DOES see the rendered tier (a sync shim, or
          # any provenance that echoes `size`) is covered instead of billing 8 against a 5 reserve.
          #
          # Publishing a value REPLACES the reserve's fallback ceiling (the dearest row this model can
          # bill) rather than bounding it. So a wrong-and-cheap value is worse for solvency than
          # publishing nothing at all: omitting the field over-reserves, while naming the cheap tier
          # puts the reserve BELOW the bill. Get it right or leave it out.
          seconds: 5
          size: "1080p"

    - model: "happyhorse-1.0"
      # TODO: same as above — set to DashScope's exact model identifier.
      canonicalId: "happyhorse-1.0"
      outputPriceUSDPerSecond: "0.28"
      billing:
        mode: per_video_second
        resolutionMultipliers:
          "720p": 1.0
          "1080p": 1.5
      modelInfo:
        name: "HappyHorse 1.0"
        description: "Alibaba DashScope HappyHorse video-generation model, v1.0"
        architecture:
          modality: "text->video"
          inputModalities: ["text"]
          outputModalities: ["video"]
        supportedParameters:
          - prompt
          - size
          - seconds
        # REQUIRED for video-generation, and billing-relevant rather than merely
        # documentation: the pre-flight balance reserve prices a create that OMITS
        # `seconds` / `size` at these values, because the upstream applies its own
        # defaults and bills them. Publish what the upstream actually applies —
        # Omitting `seconds` is WARNED about at boot and then refused at request
        # time (a broker-attributed 503), because refusing every conforming create
        # that omits the field is the alternative — so publish it. A PRESENT-but-
        # unusable value for either field fails the boot instead: that one is a typo
        # the operator cannot otherwise see (a wrong `size` silently moves the
        # reserve away from the bill, with no error, log or metric).
        defaultParameters:
          # 1080p, NOT the cheaper 720p row: with no resolution in the request DashScope applies
          # its OWN default of 1080P (see videotranslator sizeToDashScopeParams), so 1080p is the
          # tier the RESERVE must cover. This is a reserve statement only — an earlier version of
          # this comment claimed it also fixed the provider under-billing itself, and that is wrong:
          # settlement's published-size substitution is per_unit_table only, and this block is
          # per_video_second, so a size-less create still BILLS the 1.0 baseline whatever is
          # published here. Measured: reserve 8, bill 5. The under-billing is a separate gap; what
          # this value buys is that a settlement which DOES see the rendered tier (a sync shim, or
          # any provenance that echoes `size`) is covered instead of billing 8 against a 5 reserve.
          #
          # Publishing a value REPLACES the reserve's fallback ceiling (the dearest row this model can
          # bill) rather than bounding it. So a wrong-and-cheap value is worse for solvency than
          # publishing nothing at all: omitting the field over-reserves, while naming the cheap tier
          # puts the reserve BELOW the bill. Get it right or leave it out.
          seconds: 5
          size: "1080p"

# Optional: rate limiting and concurrency configuration (RPM applies to every
# service type; video-generation has no dedicated per-minute dimension of its
# own today, unlike TPM for chatbot/speech-to-text or IPM for image).
# concurrencyLimit:
#   maxGlobalConcurrent: 20
#   maxPerUserConcurrent: 5
#   perUserRPM: 30
#   perUserBurst: 5

# Optional: HTTP client timeouts for broker→provider communication. Video
# generation can take minutes upstream — tune generously.
# providerHttp:
#   totalTimeout: "15m"
#   responseHeaderTimeout: "15m"
