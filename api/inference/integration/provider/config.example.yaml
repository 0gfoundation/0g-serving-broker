interval:
  autoSettleBufferTime: 60
  forceSettlementProcessor: 600
  settlementProcessor: 300
networks:
  ethereum0g:
    url: "https://evmrpc-testnet.0g.ai"
    chainID: 16602
    privateKeys:
      - <Private_Key>
    transactionLimit: 5000000
    gasEstimationBuffer: 100000
service:
  servingUrl: <Serving URL>
  targetUrl: <Target URL>
  inputPrice: <Input Price>
  outputPrice: <Output Price>
  type: "chatbot"
  model: <Model>
  verifiability: "TeeML"
  # Optional: organization name shown in the owned_by field of GET /v1/models
  # ownedBy: "0G Foundation"
  # Optional: enrich GET /v1/models response with model metadata
  # modelInfo:
  #   name: "Meta: Llama 3.1 8B Instruct"
  #   description: "Meta's Llama 3.1 8B Instruct model for general-purpose chat"
  #   contextLength: 131072
  #   maxCompletionTokens: 4096
  #   architecture:
  #     modality: "text->text"
  #     inputModalities: ["text"]
