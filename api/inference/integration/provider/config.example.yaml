interval:
  autoSettleBufferTime: "60s"
  forceSettlementProcessor: "10m"
  settlementProcessor: "5m"
# Settlement profitability: defer users whose fees don't cover gas costs.
# minSettlementFee is the minimum accumulated fee (in neuron) per user.
# Default "4000000000000000" (0.004 A0GI). Set to "0" to disable.
# settlement:
#   minSettlementFee: "4000000000000000"
network:
  url: "https://evmrpc-testnet.0g.ai"
  chainID: 16602
  privateKeys:
    - <Private_Key>
  transactionLimit: 5000000
  gasEstimationBuffer: 100000
service:
  servingUrl: <Serving URL>
  targetUrl: <Target URL>
  inputPrice: <Input Price>
  outputPrice: <Output Price>
  type: "chatbot"
  model: <Model>
  # Optional: canonical model id used by the router catalog (e.g. "glm-5.1",
  # "deepseek-v3"). Bare lowercase, no namespace. When set, it is exposed in
  # GET /v1/models as canonical_id and also accepted as a valid value of the
  # request "model" field (alongside `model` above and any `modelAliases`).
  # Not written on-chain, so changing it does NOT invalidate user
  # acknowledgements. Leave unset to let the router fall back to its own
  # registry-based mapping from `model`.
  # canonicalId: "glm-5.1"
  # Optional: legacy model identifiers accepted on incoming requests in
  # addition to `model`. Lets you rename the advertised model without
  # breaking clients that still send the old name.
  # modelAliases:
  #   - "zai-org/GLM-5.1"
  verifiability: "TeeML"
  # Optional: organization name shown in the owned_by field of GET /v1/models
  # ownedBy: "0G Foundation"
  # Optional: enrich GET /v1/models response with model metadata
  # modelInfo:
  #   name: "Meta: Llama 3.1 8B Instruct"
  #   description: "Meta's Llama 3.1 8B Instruct model for general-purpose chat"
  #   contextLength: 131072
  #   maxCompletionTokens: 4096
  #   architecture:
  #     modality: "text->text"
  #     inputModalities: ["text"]
  #     outputModalities: ["text"]
  #     instructType: "chatml"  # Instruction format: "none", "alpaca", "chatml", etc.
  #     tokenizer: "llama3"    # Tokenizer identifier: "cl100k_base", "o200k_base", "llama3", etc.
  #   defaultParameters:
  #     temperature: 0.7
  #     top_p: 0.9
  #   teeType: "TDX"
  #   expirationDate: "2026-12-31T00:00:00Z"  # Model availability expiration (RFC3339). After this instant, requests for the model are rejected with HTTP 410.
  #   supportedParameters:
  #     - temperature
  #     - top_p
  #     - top_k
  #     - max_tokens
  #     - frequency_penalty
  #     - presence_penalty
  #     - stop
  #   # Optional: API formats supported by this model. Defaults to ["openai"] if omitted.
  #   # Add "anthropic" if the target service supports /v1/messages (Anthropic Messages API).
  #   supportedFormats:
  #     - openai
  #     - anthropic
# Optional: rate limiting and concurrency configuration.
# concurrencyLimit:
#   maxGlobalConcurrent: 20    # Max total concurrent requests to backend (default: 20)
#   maxPerUserConcurrent: 5    # Max concurrent requests per user (default: 5)
#   perUserRPM: 30             # Max requests per minute per user (default: 30, 0 = disabled)
#   perUserBurst: 5            # Max burst size for RPM (default: 5)
#   perUserTPM: 60000          # Max tokens per minute per user (default: 0 = disabled, chatbot/speech-to-text)
#   perUserTPMBurst: 10000     # Max burst size for TPM (default: 0)
#   perUserIPM: 10             # Max images per minute per user (default: 0 = disabled, text-to-image/image-editing)
#   perUserIPMBurst: 5         # Max burst size for IPM (default: 0)
# Optional: HTTP client timeouts for broker→provider communication.
# Tune based on GPU speed and model complexity (e.g., image generation may need longer timeouts).
# providerHttp:
#   totalTimeout: "15m"          # Overall HTTP request timeout (default: 15m)
#   responseHeaderTimeout: "15m" # Max time to wait for provider to start responding (default: 15m)
