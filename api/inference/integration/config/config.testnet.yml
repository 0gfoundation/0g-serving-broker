# Configuration file for 0g-serving-broker inference service

# CORS allowed origins for API access
allowOrigins:
  - "*"

# Smart contract address for the serving broker
contractAddress: "0xa79F4c8311FF93C06b8CfB403690cc987c93F91E"

# Database configuration
database:
  # MySQL DSN (format: user:password@tcp(host:port)/database?parseTime=true)
  dsn: "root:123456@tcp(mysql:3306)/provider?parseTime=true"

# Event service configuration
event:
  # Listen address for the event process's metrics HTTP server
  listenAddr: ":8088"

# Gas price configuration for blockchain transactions
# Leave empty for automatic gas price detection
gasPrice: <gasPrice>

# Maximum gas price willing to pay for transactions
# Leave empty for no limit
maxGasPrice: <maxGasPrice>

# Timing intervals for various processing tasks (Go duration strings)
interval:
  # Buffer time before automatic settlement triggers
  autoSettleBufferTime: "60s"

  # Interval for forced settlement processor
  forceSettlementProcessor: "10m"

  # Interval for regular settlement processor
  settlementProcessor: "5m"

# Settlement profitability configuration
settlement:
  # Minimum accumulated fee (in neuron) per user before including them in settlement.
  # Users below this threshold are deferred to accumulate more fees.
  # Default "4000000000000000" (0.004 A0GI) covers gas cost (~0.0006 A0GI) with ~7× margin.
  # Set to "0" to disable per-user filtering.
  minSettlementFee: "4000000000000000"

# Service configuration for the inference provider
service:
  # URL where the serving broker exposes its API (required)
  servingUrl: <servingUrl>

  # Target URL for the actual model inference backend (required)
  targetUrl: <targetUrl>

  # Price per input token (in wei or smallest unit) (required)
  inputPrice: <inputPrice>

  # Price per output token (in wei or smallest unit) (required)
  outputPrice: <outputPrice>

  # Type of service (e.g., "chatbot", "inference", "training")
  type: "chatbot"

  # Model type identifier (e.g., "llama", "gpt", etc.) (required)
  model: <model>

  # Verifiability mode for the service
  verifiability: "TeeML"

  # Additional secrets/credentials for service authentication
  additionalSecret: {}

  # (Optional) Provider stake amount for first-time service registration
  # providerStake: "100000000000000000000"

  # (Optional) Organization name for owned_by field in /v1/models
  # ownedBy: "0G Foundation"

  # (Optional) Model metadata for /v1/models endpoint enrichment
  # modelInfo:
  #   name: "Meta: Llama 3.1 8B Instruct"
  #   description: "Meta's Llama 3.1 8B Instruct model"
  #   contextLength: 131072
  #   maxCompletionTokens: 4096
  #   architecture:
  #     modality: "text->text"
  #     inputModalities: ["text"]
  #     outputModalities: ["text"]
  #     instructType: "chatml"
  #     tokenizer: "llama3"
  #   supportedParameters: ["temperature", "top_p", "top_k", "max_tokens"]
  #   # ENFORCED when set: requests on an undeclared surface get HTTP 400. Add
  #   # "anthropic" if the upstream serves /v1/messages; omit to accept every surface.
  #   supportedFormats: ["openai"]
  #   defaultParameters:
  #     temperature: 0.7
  #     top_p: 0.9
  #   teeType: "TDX"
  #   expirationDate: "2026-12-31T00:00:00Z"  # After this instant, requests for the model are rejected with HTTP 410.

# Network configuration for blockchain connection (0G testnet)
network:
  # RPC URL for the blockchain network
  url: "https://evmrpc-testnet.0g.ai"

  # Chain ID of the network
  chainID: 16602

  # Private keys for transaction signing (keep secure!)
  privateKeys:
    - <privateKey>

  # Maximum number of transactions to process in parallel
  transactionLimit: 5000000

  # Buffer for gas estimation
  gasEstimationBuffer: 100000

# Monitoring configuration
monitor:
  # Enable/disable monitoring service
  enable: false

  # Address of the monitoring event service
  eventAddress: "0g-serving-provider-event:3081"

# Zero-knowledge configuration
zk:
  # URL for the ZK service
  url: "nginx:3001"

  # Maximum request length for ZK operations
  requestLength: 40

# Chat session cache expiration time (in Go duration format, e.g., "20m" for 20 minutes)
chatCacheExpiration: "20m"

# Enable NVIDIA GPU support for inference
nvGPU: false
